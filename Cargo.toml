[workspace]
resolver = "3"
members = ["crates/relay-core", "crates/relay-platform", "crates/relay-playback", "crates/relay-player", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2024"
authors = ["HappyRave"]
license = "MIT"
repository = "https://github.com/HappyRave/Relay"
# The highest rust-version among the dependencies (sysinfo); CI checks it.
rust-version = "1.95"

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-platform = { path = "crates/relay-platform" }
relay-playback = { path = "crates/relay-playback" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so a panic still runs the engine's Drop, which releases
# every key and button a macro was holding.
strip = true

# Image search is a tight numeric loop: full speed there is worth the size,
# and in dev builds too, where it's otherwise some 40 times slower.
[profile.release.package.relay-core]
opt-level = 3

[profile.dev.package.relay-core]
opt-level = 3
