[workspace]
resolver = "3"
members = ["crates/relay-core", "crates/relay-platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["HappyRave"]
repository = "https://github.com/HappyRave/Relay"
rust-version = "1.85"

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-platform = { path = "crates/relay-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
