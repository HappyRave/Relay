[workspace]
resolver = "3"
members = ["crates/relay-core", "crates/relay-platform", "src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["HappyRave"]
license = "MIT"
repository = "https://github.com/HappyRave/Relay"
# The highest rust-version among the dependencies (sysinfo); CI checks it.
rust-version = "1.95"

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-platform = { path = "crates/relay-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so a panic still runs the engine's Drop, which releases
# every key and button a macro was holding.
strip = true
