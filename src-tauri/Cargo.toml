[package]
name = "relay"
description = "Relay macro recorder"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
relay-core = { workspace = true, features = ["samples"] }
relay-platform.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26", features = ["serde"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"
thiserror.workspace = true
crossbeam-channel = "0.5.17"
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
