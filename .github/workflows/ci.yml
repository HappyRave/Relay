name: CI

# Changes reach main only through pull requests, and CI runs on those.
# - quick (Linux, a few minutes): every push to a PR, drafts included.
# - windows and msrv (the expensive part): once the PR is ready for review, and
#   only if it changes more than docs. Skipped jobs count as passed checks.
# Run it on any branch by hand from Actions → CI → Run workflow. Everyday checks
# run locally: npm run verify.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to a PR cancels its run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What runs anywhere: the portable crates (the platform crate's stub backend
  # stands in for Windows here), formatting, and the whole frontend.
  quick:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does it change more than docs?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ] &&
             ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: cargo fmt --all -- --check
      - run: cargo test -p relay-core -p relay-platform
      - run: cargo clippy -p relay-core -p relay-platform --all-targets -- -D warnings
      - run: npm ci
      - run: npm run check
      - run: npm test

  windows:
    needs: quick
    if: needs.quick.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Rust tests (also regenerates the TS bindings and browser fixture)
        run: cargo test --workspace
      - name: Generated files are up to date
        run: git diff --exit-code -- src/lib/ipc/bindings src/lib/dev/sample-views.json
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the installer
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: relay-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/relay.exe
          if-no-files-found: error
      - name: End-to-end tests (the release build, driven over DevTools)
        id: e2e
        run: >-
          node --test --test-concurrency=1 --test-timeout=120000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/github-reporter.mjs --test-reporter-destination=stdout
          e2e/
        env:
          RELAY_EXE: target/release/relay.exe
      - name: Diagnose a failed end-to-end run
        if: failure() && steps.e2e.outcome == 'failure'
        run: node e2e/ci-diagnose.mjs
        env:
          RELAY_EXE: target/release/relay.exe

  # Builds everything with the oldest Rust that Cargo.toml's rust-version
  # promises, so that promise stays true.
  msrv:
    needs: quick
    if: needs.quick.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The app embeds the built UI, so it has to exist before cargo check.
      - run: npm run build
      - run: cargo check --workspace --all-targets
