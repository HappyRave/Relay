name: CI

on:
  push:
    branches: [main, "m*-*", "fix-*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Rust tests (also regenerates the TS bindings and browser fixture)
        run: cargo test --workspace
      - name: Generated files are up to date
        run: git diff --exit-code -- src/lib/ipc/bindings src/lib/dev/sample-views.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run check
      - run: npm test
      - name: Build the installer
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: relay-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/relay.exe
          if-no-files-found: error
      # The runner's WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, but reads
      # the same arguments from this per-exe registry value.
      - name: Let WebView2 open a debugging port for relay.exe
        run: reg add "HKCU\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" /v relay.exe /t REG_SZ /d "--remote-debugging-port=9333" /f
      - name: End-to-end tests (the release build, driven over DevTools)
        run: >-
          node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/github-reporter.mjs --test-reporter-destination=stdout
          e2e/
        env:
          RELAY_EXE: target/release/relay.exe
          RELAY_E2E_PORT: 9333
      - name: Diagnose a failed end-to-end run
        if: failure()
        run: node e2e/ci-diagnose.mjs
        env:
          RELAY_EXE: target/release/relay.exe
          RELAY_E2E_PORT: 9333

  # The core and platform crates must stay portable (the platform crate's
  # stub backend stands in for Windows here).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p relay-core -p relay-platform
      - run: cargo clippy -p relay-core -p relay-platform --all-targets -- -D warnings

  # Builds everything with the oldest Rust that Cargo.toml's rust-version
  # promises, so that promise stays true.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The app embeds the built UI, so it has to exist before cargo check.
      - run: npm run build
      - run: cargo check --workspace --all-targets
