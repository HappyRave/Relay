name: CI

# CI minutes are spent on what matters: pull requests, every push to main, and
# a push to a milestone or fix branch only when its last commit says [ci] in its
# message (the check before merging). Other pushes start the workflow, but its jobs
# are skipped and cost nothing. Everyday checks run locally: npm run verify.
on:
  push:
    branches: [main, "m*-*", "fix-*"]
  pull_request:
  workflow_dispatch:

# A newer checked push to the same branch cancels the run in progress (never
# on main). Skipped runs are in their own group, so they cancel nothing.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci]') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Rust tests (also regenerates the TS bindings and browser fixture)
        run: cargo test --workspace
      - name: Generated files are up to date
        run: git diff --exit-code -- src/lib/ipc/bindings src/lib/dev/sample-views.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run check
      - run: npm test
      - name: Build the installer
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: relay-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/relay.exe
          if-no-files-found: error
      - name: End-to-end tests (the release build, driven over DevTools)
        id: e2e
        run: >-
          node --test --test-concurrency=1 --test-timeout=120000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/github-reporter.mjs --test-reporter-destination=stdout
          e2e/
        env:
          RELAY_EXE: target/release/relay.exe
      - name: Diagnose a failed end-to-end run
        if: failure() && steps.e2e.outcome == 'failure'
        run: node e2e/ci-diagnose.mjs
        env:
          RELAY_EXE: target/release/relay.exe

  # The core and platform crates must stay portable (the platform crate's
  # stub backend stands in for Windows here).
  linux:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p relay-core -p relay-platform
      - run: cargo clippy -p relay-core -p relay-platform --all-targets -- -D warnings

  # Builds everything with the oldest Rust that Cargo.toml's rust-version
  # promises, so that promise stays true.
  msrv:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The app embeds the built UI, so it has to exist before cargo check.
      - run: npm run build
      - run: cargo check --workspace --all-targets
