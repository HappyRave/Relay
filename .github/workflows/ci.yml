name: CI

# Changes reach main only through pull requests, and CI runs on those.
# - quick (Linux, a few minutes): every push to a PR, drafts included.
# - windows and msrv (the expensive part): once the PR is ready for review, and
#   only if it changes more than docs. Skipped jobs count as passed checks.
# Run it on any branch by hand from Actions → CI → Run workflow. Everyday checks
# run locally: npm run verify.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to a PR cancels its run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What runs anywhere: the portable crates (the platform crate's stub backend
  # stands in for Windows here, and the player's logic is tested without its
  # window), formatting, and the whole frontend.
  quick:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does it change more than docs?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ] &&
             ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: cargo fmt --all -- --check
      - run: cargo test -p relay-core -p relay-platform -p relay-playback -p relay-player
      - run: cargo clippy -p relay-core -p relay-platform -p relay-playback -p relay-player --all-targets -- -D warnings
      - run: npm ci
      - run: npm run check
      - run: npm test

  windows:
    needs: quick
    if: needs.quick.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Rust tests (also regenerates the TS bindings and browser fixture)
        run: cargo test --workspace
        env:
          # The AutoHotkey export's tests write their scripts here, for the next step.
          RELAY_AHK_DIR: ${{ github.workspace }}/target/ahk
      - name: AutoHotkey exports load without errors (checked, never run)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ahk.zip"
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.28/AutoHotkey_2.0.28.zip -OutFile $zip
          $sha = "b63be7548792b4ad0dfe424d91cc69376694ed2f758245b7a75a0c77d693b478"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha) { Write-Output "::error::AutoHotkey's download isn't the expected file"; exit 1 }
          Expand-Archive $zip "$env:RUNNER_TEMP\ahk"
          $scripts = @(Get-ChildItem target/ahk/*.ahk)
          if ($scripts.Count -eq 0) { Write-Output "::error::The tests wrote no scripts to check"; exit 1 }
          $failed = 0
          foreach ($f in $scripts) {
            $log = "$env:RUNNER_TEMP\$($f.BaseName).log"
            # /Validate loads the script and exits without running it.
            $p = Start-Process "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" -ArgumentList "/ErrorStdOut", "/Validate", "`"$($f.FullName)`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
            if ($p.ExitCode -ne 0) {
              $failed++
              Write-Output "::error title=AutoHotkey export::$($f.Name): $((Get-Content $log -Raw) -replace '\r?\n', ' ')"
            } else {
              Write-Output "$($f.Name): OK"
            }
          }
          if ($failed) { exit 1 }
      - name: Generated files are up to date
        shell: bash
        run: |
          changed=$(git status --porcelain -- src/lib/ipc/bindings src/lib/dev src/test/path-cases.json)
          [ -z "$changed" ] || { echo "$changed"; echo "::error::cargo test changed generated files: commit them"; exit 1; }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the installer
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: relay-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/relay.exe
            target/player/release/relay-player.exe
          if-no-files-found: error
          retention-days: 14
      - name: The player's size (embedded in every exported program)
        shell: bash
        run: |
          size=$(stat -c %s target/player/release/relay-player.exe)
          echo "relay-player.exe: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -le $((2 * 1024 * 1024)) ] || { echo "::error::The player is over 2 MB ($size bytes)"; exit 1; }
      - name: End-to-end tests (the release build, driven over DevTools)
        id: e2e
        run: >-
          node --test --test-concurrency=1 --test-timeout=120000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./e2e/github-reporter.mjs --test-reporter-destination=stdout
          e2e/
        env:
          RELAY_EXE: target/release/relay.exe
      - name: Diagnose a failed end-to-end run
        if: failure() && steps.e2e.outcome == 'failure'
        run: node e2e/ci-diagnose.mjs
        env:
          RELAY_EXE: target/release/relay.exe

  # Builds everything with the oldest Rust that Cargo.toml's rust-version
  # promises, so that promise stays true.
  msrv:
    needs: quick
    if: needs.quick.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The app embeds the built UI, so it has to exist before cargo check.
      - run: npm run build
      - run: cargo check --workspace --all-targets
