name: CI

on:
  push:
    branches: [main, "m*-*", "fix-*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rust tests (also regenerates the TS bindings and browser fixture)
        run: cargo test --workspace
      - name: Generated files are up to date
        run: git diff --exit-code -- src/lib/ipc/bindings src/lib/dev/sample-views.json
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run check
      - run: npm test
      - name: Build the installer
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: relay-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/relay.exe
          if-no-files-found: error

  # The core and platform crates must stay portable (the platform crate's
  # stub backend stands in for Windows here).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p relay-core -p relay-platform
      - run: cargo clippy -p relay-core -p relay-platform --all-targets -- -D warnings

  # Builds everything with the oldest Rust that Cargo.toml's rust-version
  # promises, so that promise stays true.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The app embeds the built UI, so it has to exist before cargo check.
      - run: npm run build
      - run: cargo check --workspace --all-targets
