[package]
name = "relay-core"
description = "Relay macro model, step grouping, edits and file format (no OS dependencies)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The design's sample macros, used as test fixtures and to seed the dev library.
samples = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }
fastrand = "2.5"

[dev-dependencies]
chrono-tz = "0.10"
proptest = "1.11"
insta = { version = "1.48", features = ["json"] }
